<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- csbot mark: a gold diamond with a cut-out centre (a map marker), on a dark rounded tile. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e3a01f"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="#0e1014"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#2f3541" stroke-width="12"/>
  <rect x="140" y="140" width="232" height="232" rx="34" fill="url(#gold)" transform="rotate(45 256 256)"/>
  <rect x="206" y="206" width="100" height="100" rx="14" fill="#0e1014" transform="rotate(45 256 256)"/>
  <rect x="238" y="238" width="36" height="36" rx="6" fill="url(#gold)" transform="rotate(45 256 256)"/>
</svg>
