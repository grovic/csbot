name: release

# Publishes the Windows desktop installer to GitHub Releases when a version tag is pushed
# (git tag v0.5.0 && git push origin v0.5.0). Installed apps update themselves from these
# releases (electron-updater reads latest.yml). Unsigned beta: no certificate yet.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tools/check-secrets.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but apps/desktop is $v"; exit 1; }
      - run: pnpm --filter @csbot/web build
      - run: node apps/desktop/scripts/stage.mjs
      - name: Build the installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win nsis --publish never
      # One release with all three files. electron-builder's own publishing uploads the installer and
      # its blockmap in parallel, and each upload created its own release for the tag (v0.5.0, v0.6.0).
      - name: Publish the release
        working-directory: apps/desktop/release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$v" --generate-notes             "csbot-Setup-$v.exe" "csbot-Setup-$v.exe.blockmap" latest.yml
