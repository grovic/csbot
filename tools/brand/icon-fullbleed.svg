<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Same mark on a full square, for platforms that round or mask the icon themselves (iOS, Android). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e3a01f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0e1014"/>
  <rect x="152" y="152" width="208" height="208" rx="30" fill="url(#gold)" transform="rotate(45 256 256)"/>
  <rect x="211" y="211" width="90" height="90" rx="12" fill="#0e1014" transform="rotate(45 256 256)"/>
  <rect x="240" y="240" width="32" height="32" rx="5" fill="url(#gold)" transform="rotate(45 256 256)"/>
</svg>
